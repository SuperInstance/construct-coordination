[package]
name = "construct-coordination"
version = "0.1.0"
description = "A Rust library for Construct Coordination"
license = "MIT OR Apache-2.0"
repository = "https://github.com/casey-digennaro/construct-coordination"
edition = "2021"

[dependencies]
superinstance-protocol = { path = "../superinstance-protocol" }
superinstance-agent-trait = { path = "../superinstance-agent-trait" }
superinstance-cocapn = { path = "../superinstance-cocapn" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
